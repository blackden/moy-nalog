[project]
name = "python-moy-nalog"
version = "0.2.0"
description = "Unofficial Python client for lknpd.nalog.ru (Moy Nalog) API"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Ported by Codex", email = "devnull@example.com"}]
license = {text = "MIT"}
dependencies = [
  "httpx>=0.26.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.20",
]

[project.urls]
Homepage = "https://lknpd.nalog.ru/"
Repository = "https://github.com/your-org/python-moy-nalog"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
moy-nalog = "moy_nalog.cli:main"
